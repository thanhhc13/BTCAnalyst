<script>
const CONFIG = {
  maxLevels: 3,
  rsiPeriod: 14,
  rsiOverbought: 70,
  rsiOversold: 30,
  emaShortPeriod: 50,
  emaLongPeriod: 100,
  confluenceThreshold: 7, // Nâng ngưỡng từ 6 lên 7 điểm kỷ luật hơn
  toleranceUSD: 150 
};

function aggregateHourlyToH4(hourlyCandles) {
  const bucketMs = 4 * 60 * 60 * 1000;
  const buckets = new Map();
  for (const c of hourlyCandles) {
    const key = Math.floor(c.time / bucketMs) * bucketMs;
    if (!buckets.has(key)) {
      buckets.set(key, { time: key, open: c.open, high: c.high, low: c.low, close: c.close });
    } else {
      const b = buckets.get(key);
      b.high = Math.max(b.high, c.high);
      b.low = Math.min(b.low, c.low);
      b.close = c.close;
    }
  }
  return Array.from(buckets.values()).sort((a, b) => a.time - b.time);
}

async function fetchCoinbaseHourlyWindow(startISO, endISO) {
  const url = `https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=3600&start=${startISO}&end=${endISO}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Coinbase lỗi HTTP ${res.status}`);
  const data = await res.json();
  return data.map(c => ({ time: c[0] * 1000, open: c[3], high: c[2], low: c[1], close: c[4] }));
}

async function fetchKlinesCoinbase() {
  const now = new Date();
  const start1 = new Date(now.getTime() - 300 * 3600 * 1000);
  const start2 = new Date(now.getTime() - 600 * 3600 * 1000);
  const [w1, w2] = await Promise.all([
    fetchCoinbaseHourlyWindow(start1.toISOString(), now.toISOString()),
    fetchCoinbaseHourlyWindow(start2.toISOString(), start1.toISOString()),
  ]);
  const seen = new Map();
  [...w1, ...w2].forEach(c => seen.set(c.time, c));
  const hourly = Array.from(seen.values()).sort((a, b) => a.time - b.time);
  return aggregateHourlyToH4(hourly);
}

async function fetchKlinesCoinGecko() {
  const url = "https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=30";
  const res = await fetch(url);
  if (!res.ok) throw new Error(`CoinGecko lỗi HTTP ${res.status}`);
  const data = await res.json();
  const hourly = data.prices.map(([ts, price]) => ({ time: ts, open: price, high: price, low: price, close: price }));
  return aggregateHourlyToH4(hourly);
}

async function fetchCandles() {
  try {
    return await fetchKlinesCoinbase();
  } catch (e) {
    console.warn("Coinbase thất bại, fallback CoinGecko:", e.message);
    return await fetchKlinesCoinGecko();
  }
}

async function fetchLowerTimeframe(granularitySeconds) {
  const url = `https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=${granularitySeconds}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Coinbase (LTF) lỗi HTTP ${res.status}`);
  const data = await res.json();
  return data.map(c => ({ time: c[0] * 1000, open: c[3], high: c[2], low: c[1], close: c[4] })).sort((a,b)=>a.time-b.time);
}
async function fetchH1Candles(){ return fetchLowerTimeframe(3600); }
async function fetchM15Candles(){ return fetchLowerTimeframe(900); }

function detectPriceAction(candles) {
  if (!candles || candles.length < 2) return { patterns: [] };
  const c = candles[candles.length - 1];
  const prev = candles[candles.length - 2];
  const body = Math.abs(c.close - c.open);
  const range = c.high - c.low || 1e-9;
  const upperWick = c.high - Math.max(c.open, c.close);
  const lowerWick = Math.min(c.open, c.close) - c.low;
  const bodyRatio = body / range;
  const isBullishCandle = c.close > c.open;
  const patterns = [];

  if (lowerWick >= body * 2 && upperWick <= body * 0.6 && bodyRatio < 0.4) {
    patterns.push({ type: "bullish", label: "Pin bar tăng — từ chối giá xuống" });
  }
  if (upperWick >= body * 2 && lowerWick <= body * 0.6 && bodyRatio < 0.4) {
    patterns.push({ type: "bearish", label: "Pin bar giảm — từ chối giá lên" });
  }
  if (bodyRatio < 0.1) patterns.push({ type: "neutral", label: "Doji — thị trường lưỡng lự" });
  
  const prevBullish = prev.close > prev.open;
  if (!prevBullish && isBullishCandle && c.open <= prev.close && c.close >= prev.open) {
    patterns.push({ type: "bullish", label: "Nến nhấn chìm tăng (Bullish Engulfing)" });
  }
  if (prevBullish && !isBullishCandle && c.open >= prev.close && c.close <= prev.open) {
    patterns.push({ type: "bearish", label: "Nến nhấn chìm giảm (Bearish Engulfing)" });
  }
  return { patterns };
}

function summarizePriceAction(direction, h1PA, m15PA) {
  const wantType = direction === "BUY" ? "bullish" : "bearish";
  const againstType = direction === "BUY" ? "bearish" : "bullish";
  const notes = [];
  let confirmCount = 0, againstCount = 0;

  [{ label: "H1", pa: h1PA }, { label: "M15", pa: m15PA }].forEach(({ label, pa }) => {
    if (!pa || !pa.patterns || pa.patterns.length === 0) {
      notes.push(`${label}: Chưa phát hiện mẫu hình rõ ràng.`);
      return;
    }
    const matched = pa.patterns.filter(p => p.type === wantType);
    const opposed = pa.patterns.filter(p => p.type === againstType);
    if (matched.length > 0) {
      confirmCount++;
      notes.push(`✅ ${label}: ${matched.map(p=>p.label).join(", ")}`);
    } else if (opposed.length > 0) {
      againstCount++;
      notes.push(`🚫 ${label}: ${opposed.map(p=>p.label).join(", ")} (Cảnh báo ngược hướng)`);
    } else {
      notes.push(`${label}: ${pa.patterns.map(p=>p.label).join(", ")} (trung tính)`);
    }
  });
  return { confirmCount, againstCount, notes };
}

function detectSupportResistanceAndOB(candles) {
  const highs = candles.map(c => c.high);
  const lows = candles.map(c => c.low);
  const closes = candles.map(c => c.close);
  const currentPrice = closes[closes.length - 1];
  const len = candles.length;

  let trs = [];
  for (let i = 1; i < len; i++) trs.push(Math.max(highs[i] - lows[i], Math.abs(highs[i] - closes[i-1]), Math.abs(lows[i] - closes[i-1])));
  const atr = trs.slice(-14).reduce((a, b) => a + b, 0) / Math.min(14, trs.length);

  const rawHighs = [], rawLows = [];
  for (let i = 2; i < len - 2; i++) {
    if (highs[i] >= highs[i-1] && highs[i] >= highs[i-2] && highs[i] >= highs[i+1] && highs[i] >= highs[i+2]) rawHighs.push(highs[i]);
    if (lows[i] <= lows[i-1] && lows[i] <= lows[i-2] && lows[i] <= lows[i+1] && lows[i] <= lows[i+2]) rawLows.push(lows[i]);
  }

  function clusterWithTouches(arr) {
    const rez = [];
    arr.forEach(p => {
      const match = rez.find(c => Math.abs(c.price - p) <= CONFIG.toleranceUSD);
      if (match) {
        match.price = (match.price * match.touches + p) / (match.touches + 1);
        match.touches++;
      } else {
        rez.push({ price: p, touches: 1 });
      }
    });
    return rez;
  }

  const allSup = clusterWithTouches(rawLows).filter(c => c.price < currentPrice).sort((a,b)=>b.price-a.price);
  const allRes = clusterWithTouches(rawHighs).filter(c => c.price > currentPrice).sort((a,b)=>a.price-b.price);

  // SMC Order Blocks + Dynamic Mitigation Check
  let bullishOB = null, bearishOB = null;
  for (let i = len - 2; i > Math.max(2, len - 35); i--) {
    const c = candles[i];
    if (c.close < c.open && !bullishOB && closes[i+1] > c.high) {
      bullishOB = { top: Math.min(c.open, c.high), bottom: c.low, price: c.low, touches: 0 };
    }
    if (c.close > c.open && !bearishOB && closes[i+1] < c.low) {
      bearishOB = { top: c.high, bottom: Math.max(c.open, c.close), price: c.high, touches: 0 };
    }
  }

  // Đếm số lần giá đã chạm vào OB để xác định OB còn tươi hay không
  candles.slice(-15).forEach(c => {
    if (bullishOB && c.low <= bullishOB.top && c.low >= bullishOB.bottom) bullishOB.touches++;
    if (bearishOB && c.high >= bearishOB.bottom && c.high <= bearishOB.top) bearishOB.touches++;
  });

  return { currentPrice, atr, supports: allSup.slice(0, CONFIG.maxLevels), resistances: allRes.slice(0, CONFIG.maxLevels), bullishOB, bearishOB };
}

function calculateRSI(candles, period = 14) {
  const closes = candles.map(c => c.close);
  if (closes.length < period + 1) return null;

  let gains = 0, losses = 0;
  for (let i = 1; i <= period; i++) {
    const diff = closes[i] - closes[i-1];
    if (diff >= 0) gains += diff; else losses -= diff;
  }
  let avgGain = gains / period;
  let avgLoss = losses / period;

  for (let i = period + 1; i < closes.length; i++) {
    const diff = closes[i] - closes[i-1];
    const gain = diff >= 0 ? diff : 0;
    const loss = diff < 0 ? -diff : 0;
    avgGain = (avgGain * (period - 1) + gain) / period;
    avgLoss = (avgLoss * (period - 1) + loss) / period;
  }

  if (avgLoss === 0) return 100;
  const rs = avgGain / avgLoss;
  return 100 - (100 / (1 + rs));
}

function calculateEMASeries(closes, period) {
  if (closes.length < period) return [];
  const k = 2 / (period + 1);
  const ema = [];
  let sma = 0;
  for (let i = 0; i < period; i++) sma += closes[i];
  sma /= period;
  ema[period - 1] = sma;
  for (let i = period; i < closes.length; i++) ema[i] = closes[i] * k + ema[i-1] * (1 - k);
  return ema;
}

function detectTrend(candles, shortPeriod, longPeriod) {
  const closes = candles.map(c => c.close);
  if (closes.length < longPeriod + 5) return { trend: "unknown", emaShort: null, emaLong: null };
  const emaShortSeries = calculateEMASeries(closes, shortPeriod);
  const emaLongSeries = calculateEMASeries(closes, longPeriod);
  const lastIdx = closes.length - 1;
  const emaShort = emaShortSeries[lastIdx], emaLong = emaLongSeries[lastIdx], price = closes[lastIdx];
  if (emaShort === undefined || emaLong === undefined) return { trend: "unknown", emaShort: null, emaLong: null };
  let trend;
  if (price > emaShort && emaShort > emaLong) trend = "up";
  else if (price < emaShort && emaShort < emaLong) trend = "down";
  else trend = "sideways";
  return { trend, emaShort, emaLong };
}

// 🔥 PHẪU THUẬT MA TRẬN CONFLUENCE SCORE: THÊM VETO SYSTEM (ĐIỂM PHỦ QUYẾT)
function computeConfluenceScore(direction, level, rsi, trendInfo, bestRR, paSummary, config, isOB, obData) {
  const breakdown = [];
  let score = 0;
  const isBuy = direction === "BUY";

  let rsiPoints = 0;
  if (rsi === null) {
    breakdown.push({ label: "RSI: Không có dữ liệu", points: 0 });
  } else if ((isBuy && rsi <= config.rsiOversold) || (!isBuy && rsi >= config.rsiOverbought)) {
    rsiPoints = 3; breakdown.push({ label: `RSI ${rsi.toFixed(1)} — vùng Cực Trị ủng hộ ${direction}`, points: 3 });
  } else if ((isBuy && rsi <= 45) || (!isBuy && rsi >= 55)) {
    rsiPoints = 2; breakdown.push({ label: `RSI ${rsi.toFixed(1)} — nghiêng nhẹ ủng hộ ${direction}`, points: 2 });
  } else if ((isBuy && rsi <= 55) || (!isBuy && rsi >= 45)) {
    rsiPoints = 1; breakdown.push({ label: `RSI ${rsi.toFixed(1)} — Trung tính`, points: 1 });
  } else {
    rsiPoints = -3; breakdown.push({ label: `RSI ${rsi.toFixed(1)} — NGƯỢC hướng ${direction}`, points: -3 });
  }
  score += rsiPoints;

  let zonePoints = 0;
  if (level.touches >= 4) zonePoints = 2; else if (level.touches >= 2) zonePoints = 1;
  breakdown.push({ label: `Vùng Cản đã test ${level.touches} lần`, points: zonePoints });
  score += zonePoints;

  // ĐỒNG THUẬN OB CÓ KIỂM TRA ĐỘ TƯƠI (MITIGATION)
  if (isOB) {
    if (obData && obData.touches > 2) {
      breakdown.push({ label: "Trùng SMC OB H4 nhưng đã bị Retest >2 lần (Yếu)", points: 0 });
    } else {
      score += 2;
      breakdown.push({ label: "Trùng khớp SMC OB H4 còn tươi (Cá Voi)", points: 2 });
    }
  }

  let trendPoints = 0;
  const trendTxt = trendInfo.trend === "up" ? "Xu hướng TĂNG" : trendInfo.trend === "down" ? "Xu hướng GIẢM" : trendInfo.trend === "sideways" ? "Đi ngang" : "Chưa rõ";
  if (trendInfo.trend === "unknown") {
    breakdown.push({ label: "Xu hướng: Chưa đủ dữ liệu", points: 0 });
  } else if ((isBuy && trendInfo.trend === "up") || (!isBuy && trendInfo.trend === "down")) {
    trendPoints = 2; breakdown.push({ label: `${trendTxt} — thuận hướng ${direction}`, points: 2 });
  } else if (trendInfo.trend === "sideways") {
    breakdown.push({ label: trendTxt, points: 0 });
  } else {
    trendPoints = -2; breakdown.push({ label: `${trendTxt} — NGƯỢC hướng ${direction}`, points: -2 });
  }
  score += trendPoints;

  let rrPoints = 0;
  if (bestRR === null) {
    breakdown.push({ label: "R:R: Không có đối ứng", points: 0 });
  } else if (bestRR >= 2) {
    rrPoints = 2; breakdown.push({ label: `R:R ước tính 1:${bestRR.toFixed(2)} — hấp dẫn`, points: 2 });
  } else if (bestRR >= 1) {
    rrPoints = 1; breakdown.push({ label: `R:R ước tính 1:${bestRR.toFixed(2)} — tạm ổn`, points: 1 });
  } else {
    rrPoints = -1; breakdown.push({ label: `R:R ước tính 1:${bestRR.toFixed(2)} — kém hấp dẫn`, points: -1 });
  }
  score += rrPoints;

  // 🔥 TAP VETO SYSTEM: NẾU PA KHUNG NHỎ NGƯỢC HƯỚNG TRỪ NẶNG 4 ĐIỂM
  let paPoints = 0;
  if (paSummary) {
    if (paSummary.againstCount >= 1) {
      paPoints = -4; // Điểm phủ quyết
      breakdown.push({ label: `🚨 VETO: Nến H1/M15 có ${paSummary.againstCount} khung ngược hướng (Xung đột)`, points: -4 });
    } else if (paSummary.confirmCount >= 2) {
      paPoints = 3;
      breakdown.push({ label: `Price action H1 & M15 Đồng thuận tuyệt đối`, points: 3 });
    } else if (paSummary.confirmCount === 1) {
      paPoints = 2;
      breakdown.push({ label: `Price action 1 khung xác nhận đồng thuận`, points: 2 });
    }
  }
  score += paPoints;

  return { score, breakdown };
}

function buildTargets(direction, level, currentPrice, supports, resistances, atr) {
  const isSell = direction === "SELL";
  const slBufferUSD = Math.max(250, atr * 0.8);
  const entryPrice = level.price;
  const slPrice = isSell ? entryPrice + slBufferUSD : entryPrice - slBufferUSD;
  const riskAmount = Math.abs(slPrice - entryPrice);

  const oppositeLevels = isSell ? supports : resistances;
  const targets = oppositeLevels.slice(0, 2).map(lv => {
    const rewardAmount = Math.abs(lv.price - entryPrice);
    const rr = riskAmount > 0 ? rewardAmount / riskAmount : null;
    return { price: lv.price, rr };
  });
  const bestRR = targets.length > 0 ? targets[targets.length - 1].rr : null;
  return { slPrice, targets, bestRR, entryPrice };
}

const fmt = n => n ? Math.round(n).toLocaleString('en-US') : '--';
const fmt2 = n => n ? n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '--';

function renderRSI(rsi) {
  if (rsi === null) return `<div class="skeleton">Không đủ dữ liệu</div>`;
  const pos = Math.min(Math.max(rsi, 0), 100);
  let label = 'Trung tính', color = 'var(--text)';
  if (rsi >= CONFIG.rsiOverbought) { label = '⚠️ Quá mua'; color = 'var(--down)'; }
  else if (rsi <= CONFIG.rsiOversold) { label = '⚠️ Quá bán'; color = 'var(--up)'; }
  return `
    <div class="rsi-value" style="color:${color}">${rsi.toFixed(1)}</div>
    <div class="rsi-bar-track">
      <div class="rsi-bar-fill"></div>
      <div class="rsi-marker" style="left:${pos}%"></div>
    </div>
    <div class="rsi-zones"><span>0 Oversold</span><span>50</span><span>Overbought 100</span></div>
    <div class="rsi-label" style="color:${color}">${label}</div>
  `;
}

function renderTrend(trendInfo) {
  const map = {
    up: { txt: '📈 TĂNG', cls: 'up' },
    down: { txt: '📉 GIẢM', cls: 'down' },
    sideways: { txt: '➡️ ĐI NGANG', cls: 'sideways' },
    unknown: { txt: 'Không đủ dữ liệu', cls: '' },
  };
  const t = map[trendInfo.trend];
  const emaLine = trendInfo.emaShort
    ? `EMA${CONFIG.emaShortPeriod}: $${fmt(trendInfo.emaShort)} &nbsp;|&nbsp; EMA${CONFIG.emaLongPeriod}: $${fmt(trendInfo.emaLong)}`
    : '';
  return `<div class="trend-value ${t.cls}">${t.txt}</div><div class="ema-line">${emaLine}</div>`;
}

function renderSMCOBHeader(bullishOB, bearishOB) {
  const bullStr = bullishOB ? `$${fmt(bullishOB.bottom)} - $${fmt(bullishOB.top)}` : "Chưa tạo";
  const bearStr = bearishOB ? `$${fmt(bearishOB.bottom)} - $${fmt(bearishOB.top)}` : "Chưa tạo";
  return `
    <div class="smc-ob-card">
      <span class="smc-ob-title">📊 VÙNG THÔNG SỐ CƠ BẢN SMC ORDER BLOCK (H4):</span>
      <div class="smc-ob-group">
        <div class="smc-tag smc-bull">Bullish OB: ${bullStr}</div>
        <div class="smc-tag smc-bear">Bearish OB: ${bearStr}</div>
      </div>
    </div>
  `;
}

function renderZones(supports, resistances, currentPrice) {
  const rows = [];
  resistances.slice().reverse().forEach(r => {
    const dist = ((r.price - currentPrice) / currentPrice * 100).toFixed(2);
    rows.push(`<div class="zone-row res"><span class="tag">Kháng cự</span><span>$${fmt(r.price)}</span><span class="touches">${r.touches} lần chạm</span><span class="dist">+${dist}%</span></div>`);
  });
  supports.forEach(s => {
    const dist = ((currentPrice - s.price) / currentPrice * 100).toFixed(2);
    rows.push(`<div class="zone-row sup"><span class="tag">Hỗ trợ</span><span>$${fmt(s.price)}</span><span class="touches">${s.touches} lần chạm</span><span class="dist">-${dist}%</span></div>`);
  });
  return rows.length ? `<div class="zone-list">${rows.join('')}</div>` : `<div class="skeleton">Chưa xác định được vùng</div>`;
}

function renderBreakdownRow(b) {
  const cls = b.points > 0 ? 'pos' : b.points < 0 ? 'neg' : 'zero';
  const sign = b.points > 0 ? '+' : '';
  return `<div class="bd-row"><span class="bd-points ${cls}">${sign}${b.points}</span><span class="bd-label">${b.label}</span></div>`;
}

function renderConfluencePanel(direction, level, currentPrice, score, breakdown, targets, slPrice, paSummary, entryPrice) {
  const isBuy = direction === 'BUY';
  const dirLabel = isBuy ? 'BUY (tại Hỗ trợ)' : 'SELL (tại Kháng cự)';
  const passed = score >= CONFIG.confluenceThreshold;
  const badgeCls = passed ? 'pass' : 'fail';
  const badgeTxt = passed ? `ĐẠT NGƯỠNG (${score}/14)` : `CHƯA ĐẠT (${score}/14)`;

  const targetsHtml = targets.length > 0
    ? targets.map((t, idx) => `
      <div class="setup-item">
        <div class="k">${idx === 0 ? 'TP1 (gần)' : 'TP2 (xa hơn)'}</div>
        <div class="v">$${fmt(t.price)}</div>
        <div class="rr">R:R ${t.rr !== null ? '1:' + t.rr.toFixed(2) : 'N/A'}</div>
      </div>`).join('')
    : `<div class="setup-item"><div class="k">TP</div><div class="v">N/A</div></div>`;

  const paHtml = paSummary
    ? `<div class="pa-section"><div class="pa-title">Price action H1 / M15 Smart Fetch Dynamic</div>${paSummary.notes.map(n => `<div class="pa-note">${n}</div>`).join('')}</div>`
    : `<div class="pa-section"><div class="pa-title">Price action H1 / M15</div><div class="pa-note">Chưa kích hoạt Smart Fetch (Giá nằm ngoài biên ATR $1.5x)</div></div>`;

  return `
    <div class="conf-panel">
      <div class="conf-head">
        <div>
          <div class="dir ${isBuy ? 'buy' : 'sell'}">${dirLabel}</div>
          <div class="zone-price">Vùng Entry Kỳ Vọng: $${fmt(entryPrice)} · ${level.touches} lần chạm · cách ${(Math.abs(currentPrice-level.price)/level.price*100).toFixed(2)}%</div>
        </div>
        <div class="score-badge ${badgeCls}">${badgeTxt}</div>
      </div>
      <div class="breakdown">${breakdown.map(renderBreakdownRow).join('')}</div>
      <div class="setup-grid">
        <div class="setup-item"><div class="k">Entry Kỳ Vọng</div><div class="v">$${fmt(entryPrice)}</div></div>
        <div class="setup-item"><div class="k">Stop Loss (ATR)</div><div class="v">$${fmt(slPrice)}</div></div>
        ${targetsHtml}
      </div>
      ${paHtml}
      <div class="disclaimer">*Gợi ý kỹ thuật tự động theo mô hình TAP/FPT Risk Manager.</div>
    </div>
  `;
}

let autoTimer = null;

async function loadDashboard() {
  const btn = document.getElementById('refreshBtn');
  const statusMsg = document.getElementById('statusMsg');
  const errorBox = document.getElementById('errorBox');
  btn.disabled = true;
  statusMsg.textContent = 'Đang tải dữ liệu H4...';
  errorBox.innerHTML = '';

  try {
    const candles = await fetchCandles();
    const { currentPrice, atr, supports, resistances, bullishOB, bearishOB } = detectSupportResistanceAndOB(candles);
    const rsi = calculateRSI(candles, CONFIG.rsiPeriod);
    const trendInfo = detectTrend(candles, CONFIG.emaShortPeriod, CONFIG.emaLongPeriod);

    // 🔥 SMART FETCH THEO ATR ĐỘNG: CHỈ FETCH KHI KHOẢNG CÁCH <= 1.5 * ATR
    const nearestSup = supports[0] ? supports[0].price : 0;
    const nearestRes = resistances[0] ? resistances[0].price : 999999;
    const distUSD = Math.min(Math.abs(currentPrice - nearestSup), Math.abs(currentPrice - nearestRes));
    const triggerThreshold = atr * 1.5;

    let h1Candles = null, m15Candles = null;
    if (distUSD <= triggerThreshold) {
      statusMsg.textContent = `Giá tiệm cận cản (Cách $${Math.round(distUSD)} <= 1.5x ATR)! Bật Smart Fetch H1/M15...`;
      try {
        [h1Candles, m15Candles] = await Promise.all([fetchH1Candles(), fetchM15Candles()]);
      } catch (e) {
        console.warn('Không lấy được H1/M15:', e.message);
      }
    } else {
      statusMsg.textContent = `Giá xa cản (Cách $${Math.round(distUSD)} > 1.5x ATR), tạm dừng H1/M15...`;
    }

    const priceEl = document.getElementById('priceValue');
    const prevPrice = parseFloat(priceEl.dataset.raw || currentPrice);
    priceEl.textContent = '$' + fmt2(currentPrice);
    priceEl.dataset.raw = currentPrice;
    priceEl.className = 'price ' + (currentPrice >= prevPrice ? 'up' : 'down');
    document.getElementById('updatedAt').textContent = 'Cập nhật: ' + new Date().toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh' });

    let html = '';
    html += renderSMCOBHeader(bullishOB, bearishOB);
    html += '<div class="grid">';
    html += `<div class="card"><h2>RSI (${CONFIG.rsiPeriod}, H4)</h2>${renderRSI(rsi)}</div>`;
    html += `<div class="card"><h2>Xu hướng chính (H4)</h2>${renderTrend(trendInfo)}</div>`;
    html += '</div>';
    html += `<div class="card zones-card" style="margin-bottom:16px;"><h2>Vùng hỗ trợ / kháng cự (H4)</h2>${renderZones(supports, resistances, currentPrice)}</div>`;

    if (supports.length > 0) {
      const level = supports[0];
      const direction = 'BUY';
      const isOB = bullishOB && Math.abs(level.price - bullishOB.price) <= CONFIG.toleranceUSD;
      const h1PA = h1Candles ? detectPriceAction(h1Candles) : null;
      const m15PA = m15Candles ? detectPriceAction(m15Candles) : null;
      const paSummary = (h1PA || m15PA) ? summarizePriceAction(direction, h1PA, m15PA) : null;
      const { slPrice, targets, bestRR, entryPrice } = buildTargets(direction, level, currentPrice, supports, resistances, atr);
      const { score, breakdown } = computeConfluenceScore(direction, level, rsi, trendInfo, bestRR, paSummary, CONFIG, isOB, bullishOB);
      html += renderConfluencePanel(direction, level, currentPrice, score, breakdown, targets, slPrice, paSummary, entryPrice);
    }
    if (resistances.length > 0) {
      const level = resistances[0];
      const direction = 'SELL';
      const isOB = bearishOB && Math.abs(level.price - bearishOB.price) <= CONFIG.toleranceUSD;
      const h1PA = h1Candles ? detectPriceAction(h1Candles) : null;
      const m15PA = m15Candles ? detectPriceAction(m15Candles) : null;
      const paSummary = (h1PA || m15PA) ? summarizePriceAction(direction, h1PA, m15PA) : null;
      const { slPrice, targets, bestRR, entryPrice } = buildTargets(direction, level, currentPrice, supports, resistances, atr);
      const { score, breakdown } = computeConfluenceScore(direction, level, rsi, trendInfo, bestRR, paSummary, CONFIG, isOB, bearishOB);
      html += renderConfluencePanel(direction, level, currentPrice, score, breakdown, targets, slPrice, paSummary, entryPrice);
    }

    document.getElementById('content').innerHTML = html;
    statusMsg.textContent = 'Đã cập nhật xong.';
  } catch (err) {
    console.error(err);
    errorBox.innerHTML = `<div class="error-box">Lỗi tải dữ liệu: ${err.message}.</div>`;
    statusMsg.textContent = 'Có lỗi xảy ra.';
  } finally {
    btn.disabled = false;
  }
}

function setupAutoRefresh() {
  const toggle = document.getElementById('autoToggle');
  if (autoTimer) clearInterval(autoTimer);
  if (toggle.checked) {
    autoTimer = setInterval(loadDashboard, 60000);
  }
}

document.getElementById('refreshBtn').addEventListener('click', loadDashboard);
document.getElementById('autoToggle').addEventListener('change', setupAutoRefresh);

loadDashboard();
setupAutoRefresh();
</script>
